[package]
name = "forms-ratatui"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
resolver = "3"

[lib]
crate-type = ["staticlib"]

[dependencies]
ratatui = { version = "=0.29.0", default-features = false, features = ["crossterm"] }
crossterm = "=0.28.1"
unicode-width = "=0.2.0"

[profile.release]
opt-level = "s"
lto = "thin"
